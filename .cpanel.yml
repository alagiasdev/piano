---
# Deploy automatico di cPanel (Git Version Control).
#
# cPanel clona il repository in ~/repositories/piano e, premendo "Deploy
# HEAD Commit", esegue queste istruzioni dentro quella copia.
#
# DEPLOYPATH è la cartella dell'applicazione, NON quella pubblica: il
# document root del sottodominio deve puntare a $DEPLOYPATH/public,
# cioè /home/vpsalagias/piano.alagias.com/public. Se puntasse un livello
# più su, il file .env con le credenziali del database sarebbe scaricabile.
#
# Nota importante: public/uploads/ non viene mai toccato. Ci stanno i
# loghi dei clienti e le immagini dei post, che sono dati e non codice:
# un deploy non deve poterli cancellare.
#
# ATTENZIONE, l'altra faccia della stessa scelta: `cp` aggiunge e
# sovrascrive, ma non cancella mai. Un file tolto o rinominato nel
# repository resta sul server per sempre. Finora non e' mai successo, ma
# il giorno che capita va rimosso a mano da File Manager -- e il caso da
# ricordare e' database/migrations/: una migrazione rimasta li' verrebbe
# vista come "in sospeso" e riapplicata. Il rimedio automatico sarebbe
# rsync --delete, ma un solo --exclude sbagliato cancellerebbe le immagini
# dei clienti: meglio una nota che una scorciatoia pericolosa.

deployment:
  tasks:
    - export DEPLOYPATH=/home/vpsalagias/piano.alagias.com

    - /bin/mkdir -p $DEPLOYPATH/app
    - /bin/mkdir -p $DEPLOYPATH/database
    - /bin/mkdir -p $DEPLOYPATH/public/assets
    - /bin/mkdir -p $DEPLOYPATH/public/uploads

    # Codice dell'applicazione
    - /bin/cp -R app/. $DEPLOYPATH/app/
    - /bin/cp -R database/. $DEPLOYPATH/database/
    - /bin/cp composer.json $DEPLOYPATH/composer.json

    # Parte pubblica, file per file: così uploads/ resta dov'è
    - /bin/cp -R public/assets/. $DEPLOYPATH/public/assets/
    - /bin/cp public/index.php $DEPLOYPATH/public/index.php
    - /bin/cp public/.htaccess $DEPLOYPATH/public/.htaccess
    - /bin/cp public/uploads/.htaccess $DEPLOYPATH/public/uploads/.htaccess

    # Riferimento per chi installa da zero
    - /bin/cp .env.example $DEPLOYPATH/.env.example
    - /bin/cp README.md $DEPLOYPATH/README.md
    - /bin/cp SVILUPPI.md $DEPLOYPATH/SVILUPPI.md
